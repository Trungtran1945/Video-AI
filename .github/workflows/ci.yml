name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: video_ai
          POSTGRES_USER: video_ai_user
          POSTGRES_PASSWORD: VideoAI_Secure_Db_2026!
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://video_ai_user:VideoAI_Secure_Db_2026!@localhost:5433/video_ai
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: video_ai
      DB_USER: video_ai_user
      DB_PASSWORD: VideoAI_Secure_Db_2026!
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Repository Secret Scan
        run: cd backend && node scripts/scan-secrets.mjs

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Audit backend dependencies (DevSecOps High/Critical Gate)
        run: cd backend && npm audit --audit-level=high

      - name: Audit frontend dependencies (DevSecOps High/Critical Gate)
        run: cd frontend && npm audit --audit-level=high

      - name: Lint backend
        run: cd backend && npm run lint

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && ffmpeg -version

      - name: Test backend
        run: cd backend && npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: test-refresh-secret-0123456789abcdef
          MASTER_KEY: test-master-key-0123456789abcdef

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Typecheck frontend
        run: cd frontend && npm run typecheck

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Production deployment config contract
        run: cd backend && node tests/deploymentSmoke.test.mjs
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: test-refresh-secret-0123456789abcdef
          MASTER_KEY: test-master-key-0123456789abcdef

      - name: Production runtime smoke (NODE_ENV=production, ephemeral port, ephemeral redis)
        run: cd backend && node tests/productionRuntimeSmoke.test.mjs
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: test-refresh-secret-0123456789abcdef
          MASTER_KEY: test-master-key-0123456789abcdef

      - name: Docker Compose integration (config + redis/api runtime)
        run: cd backend && node tests/dockerIntegration.test.mjs
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: test-refresh-secret-0123456789abcdef
          MASTER_KEY: test-master-key-0123456789abcdef
          CORS_ORIGINS: https://app.example.com

  zerotts-e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: video_ai
          POSTGRES_USER: video_ai_user
          POSTGRES_PASSWORD: VideoAI_Secure_Db_2026!
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://video_ai_user:VideoAI_Secure_Db_2026!@localhost:5433/video_ai
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: video_ai
      DB_USER: video_ai_user
      DB_PASSWORD: VideoAI_Secure_Db_2026!
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libportaudio2 && ffmpeg -version

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install ZeroTTS locked deps
        run: pip install "onnxruntime>=1.17" "numpy>=1.26" "soundfile>=0.12" zerotts

      - name: Cache ZeroTTS model (~900MB)
        uses: actions/cache@v6
        with:
          path: ~/.cache
          key: zerotts-model-v1-${{ runner.os }}

      - name: ZeroTTS E2E (service startup + readiness + test + cleanup)
        run: cd backend && npm run test:zerotts
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: test-refresh-secret-0123456789abcdef
          MASTER_KEY: test-master-key-0123456789abcdef
          RUN_ZEROTTS_INTEGRATION: '1'

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: asf-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: asf-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
