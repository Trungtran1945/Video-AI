name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Lint backend
        run: cd backend && npm run lint

      - name: Test backend
        run: cd backend && npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: test-refresh-secret-0123456789abcdef
          MASTER_KEY: test-master-key-0123456789abcdef

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Typecheck frontend
        run: cd frontend && npm run typecheck

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Production deployment config contract
        run: cd backend && node tests/deploymentSmoke.test.mjs
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: test-refresh-secret-0123456789abcdef
          MASTER_KEY: test-master-key-0123456789abcdef

      - name: Production runtime smoke (NODE_ENV=production, ephemeral port, ephemeral redis)
        run: cd backend && node tests/productionRuntimeSmoke.test.mjs
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: test-refresh-secret-0123456789abcdef
          MASTER_KEY: test-master-key-0123456789abcdef

      - name: Docker Compose integration (config + redis/api runtime)
        run: cd backend && node tests/dockerIntegration.test.mjs
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: test-refresh-secret-0123456789abcdef
          MASTER_KEY: test-master-key-0123456789abcdef
          CORS_ORIGINS: https://app.example.com

  zerotts-e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && ffmpeg -version

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install ZeroTTS locked deps
        run: pip install "onnxruntime>=1.17" "numpy>=1.26" "soundfile>=0.12"

      - name: Cache ZeroTTS model (~900MB)
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: zerotts-model-v1-${{ runner.os }}

      - name: ZeroTTS E2E (service startup + readiness + test + cleanup)
        run: cd backend && npm run test:zerotts
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: test-refresh-secret-0123456789abcdef
          MASTER_KEY: test-master-key-0123456789abcdef
          RUN_ZEROTTS_INTEGRATION: '1'

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: asf-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: asf-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
