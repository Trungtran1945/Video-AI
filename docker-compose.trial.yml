# Trial local cho bạn bè / người phỏng vấn: clone repo → docker compose up → http://localhost
# KHÔNG cần API key (Demo mode dùng provider mô phỏng). Chỉ bind 127.0.0.1.
# Chạy: docker compose -f docker-compose.trial.yml up -d --build
# Dừng: docker compose -f docker-compose.trial.yml down
# Xoá sạch dữ liệu: docker compose -f docker-compose.trial.yml down -v

services:
  redis:
    image: redis:7-alpine
    volumes:
      - trial_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: video_ai
      POSTGRES_USER: video_ai_user
      POSTGRES_PASSWORD: VideoAI_Trial_Only_2026!
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - trial_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_ai_user -d video_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      # development = dùng dev secret có sẵn, không cần tạo .env
      - NODE_ENV=development
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://video_ai_user:VideoAI_Trial_Only_2026!@postgres:5432/video_ai
      - INSTANCE_MODE=single
      # Demo mode: fallback mock khi không có API key (xem backend/src/providers/registry.js)
      - DEFAULT_PROVIDER_MODE=mock
      # HTTP local: cookie không Secure, không enforce HTTPS, tin nginx proxy
      - COOKIE_SECURE=false
      - DISABLE_FORCE_HTTPS=true
      - TRUST_PROXY=1
      - CORS_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80
      # Tài khoản demo được seed sẵn (đăng ký mới cần SMTP/OTP)
      - ADMIN_EMAIL=demo@local.test
      - ADMIN_PASSWORD=demo12345678
      - MAX_CONCURRENT_PROJECTS_PER_USER=1
      - PROJECT_RETENTION_DAYS=7
      - MAX_STORED_PROJECTS_PER_USER=5
      - NOTIFY_FROM_EMAIL=noreply@local.test
      # Để trống: demo chạy không cần key. Muốn dùng AI thật → xem LOCAL_TRIAL_SETUP.md
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - WHISPER_API_KEY=${WHISPER_API_KEY:-}
      - WHISPER_BASE_URL=${WHISPER_BASE_URL:-https://api.groq.com/openai/v1}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-large-v3}
      - GOOGLE_TRANSLATE_SCRIPT_URL=${GOOGLE_TRANSLATE_SCRIPT_URL:-}
      - EDGE_TTS_VOICE=${EDGE_TTS_VOICE:-vi-VN-HoaiMyNeural}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
    volumes:
      - trial_storage_data:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${TRIAL_WEB_PORT:-80}:80"
    volumes:
      # HTTP-only: không redirect sang HTTPS self-signed
      - ./docker/nginx.trial.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  trial_redis_data:
  trial_postgres_data:
  trial_storage_data:
