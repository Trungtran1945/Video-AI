services:
  redis:
    image: redis:7-alpine
    # No public ports by default: API reaches Redis via internal Docker network
    # (REDIS_HOST=redis). Local dev needing host access:
    #   docker compose -f docker-compose.yml -f docker-compose.redis-host.yml up
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: video-ai-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-video_ai}
      POSTGRES_USER: ${DB_USER:-video_ai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-VideoAI_Secure_Db_2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-video_ai_user} -d ${DB_NAME:-video_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${DB_USER:-video_ai_user}:${DB_PASSWORD:-VideoAI_Secure_Db_2026!}@postgres:5432/${DB_NAME:-video_ai}
      - INSTANCE_MODE=single
      - DB_MAX_PENDING_WRITES=${DB_MAX_PENDING_WRITES:-1000}
      - DB_SLOW_WRITE_MS=${DB_SLOW_WRITE_MS:-1000}
      - PROJECT_LEASE_SECONDS=${PROJECT_LEASE_SECONDS:-1800}
      - UPLOAD_SESSION_TTL_MINUTES=${UPLOAD_SESSION_TTL_MINUTES:-60}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-}
      - MASTER_KEY=${MASTER_KEY:-}
      # Admin bootstrap production (khớp resolveAdminSeed trong backend/src/db/seed.js):
      # rỗng = skip + warn (vẫn boot), <12 ký tự = fail-fast throw.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - MAX_CONCURRENT_PROJECTS_PER_USER=${MAX_CONCURRENT_PROJECTS_PER_USER:-2}
      - PROJECT_RETENTION_DAYS=${PROJECT_RETENTION_DAYS:-30}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - NOTIFY_FROM_EMAIL=${NOTIFY_FROM_EMAIL:-noreply@asf.local}
      - QUOTA_WARNING_THRESHOLD=${QUOTA_WARNING_THRESHOLD:-0.8}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - WHISPER_API_KEY=${WHISPER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - WHISPER_BASE_URL=${WHISPER_BASE_URL:-https://api.openai.com/v1}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-1}
      - WHISPER_TEMPERATURE=${WHISPER_TEMPERATURE:-0}
      - WHISPER_INITIAL_PROMPT=${WHISPER_INITIAL_PROMPT:-}
      # Prod CORS fail-closed khi rỗng: same-origin qua nginx :80 không cần set;
      # gọi trực tiếp :3001/domain khác phải set (xem README §6.3).
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # HTTP LAN nội bộ (http://<LAN-IP>): giữ true chỉ khi đã terminate TLS,
      # ngược lại browser drop cookie refresh_token → COOKIE_SECURE=false.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - VOICESTUDIO_URL=${VOICESTUDIO_URL:-http://voicestudio:3900}
      - VOICESTUDIO_TIMEOUT_MS=${VOICESTUDIO_TIMEOUT_MS:-60000}
    volumes:
      - storage_data:/app/storage
      - db_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # VoiceStudio local inference (OpenAI-compatible speech API, keyless)
  voicestudio:
    image: ${VOICESTUDIO_IMAGE:-ghcr.io/debpalash/voicestudio:stable}
    ports:
      - "3900:3900"
    environment:
      - OMNIVOICE_DATA_DIR=/app/omnivoice_data
    volumes:
      - voicestudio_data:/app/omnivoice_data
      - voicestudio_models:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3900/health',timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # NOTE: there is deliberately NO separate `worker` service. The API service
  # runs queue workers in-process (server.js, INSTANCE_MODE=single) — a second
  # container sharing the sql.js volume cannot take writer ownership, so it
  # would crash-loop. Scale workers by running more API containers only after
  # replacing sql.js with a real client/server database.

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "80:80"
    # Chờ api healthy (healthcheck ~30s x 3 retries) để hết 502 lúc boot.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  redis_data:
  postgres_data:
  storage_data:
  db_data:
  voicestudio_data:
  voicestudio_models:
