services:
  redis:
    image: redis:7-alpine
    # No public ports by default: API reaches Redis via internal Docker network
    # (REDIS_HOST=redis). Local dev needing host access:
    #   docker compose -f docker-compose.yml -f docker-compose.redis-host.yml up
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=file:/app/data/data.db
      - DB_PATH=/app/data/data.db
      - INSTANCE_MODE=single
      - DB_MAX_PENDING_WRITES=${DB_MAX_PENDING_WRITES:-1000}
      - DB_SLOW_WRITE_MS=${DB_SLOW_WRITE_MS:-1000}
      - PROJECT_LEASE_SECONDS=${PROJECT_LEASE_SECONDS:-1800}
      - UPLOAD_SESSION_TTL_MINUTES=${UPLOAD_SESSION_TTL_MINUTES:-60}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-}
      - MASTER_KEY=${MASTER_KEY:-}
      - MAX_CONCURRENT_PROJECTS_PER_USER=${MAX_CONCURRENT_PROJECTS_PER_USER:-2}
      - PROJECT_RETENTION_DAYS=${PROJECT_RETENTION_DAYS:-30}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - NOTIFY_FROM_EMAIL=${NOTIFY_FROM_EMAIL:-noreply@asf.local}
      - QUOTA_WARNING_THRESHOLD=${QUOTA_WARNING_THRESHOLD:-0.8}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - WHISPER_API_KEY=${WHISPER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - WHISPER_BASE_URL=${WHISPER_BASE_URL:-https://api.openai.com/v1}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-1}
      - WHISPER_TEMPERATURE=${WHISPER_TEMPERATURE:-0}
      - WHISPER_INITIAL_PROMPT=${WHISPER_INITIAL_PROMPT:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - ZEROTTS_URL=${ZEROTTS_URL:-http://zerotts:5005}
      - ZEROTTS_TIMEOUT_MS=${ZEROTTS_TIMEOUT_MS:-60000}
    volumes:
      - storage_data:/app/storage
      - db_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # BE-D02: ZeroTTS local inference riêng (ONNX Runtime, keyless). Không expose public
  # port mặc định; api gọi qua http://zerotts:5005 (không 127.0.0.1 giữa containers).
  zerotts:
    build:
      context: .
      dockerfile: docker/zerotts.Dockerfile
    environment:
      - ZEROTTS_HOST=0.0.0.0
      - ZEROTTS_PORT=5005
      - ZEROTTS_MODEL=${ZEROTTS_MODEL:-zeroweight-ai/ZeroTTS}
      - ZEROTTS_VOICE=${ZEROTTS_VOICE:-maichi}
      - ZEROTTS_THREADS=${ZEROTTS_THREADS:-4}
      - ZEROTTS_CONCURRENCY=${ZEROTTS_CONCURRENCY:-1}
      - ZEROTTS_MAX_INFLIGHT_REQUESTS=${ZEROTTS_MAX_INFLIGHT_REQUESTS:-8}
      - ZEROTTS_MAX_BODY_BYTES=${ZEROTTS_MAX_BODY_BYTES:-65536}
      - ZEROTTS_MAX_TEXT_CHARS=${ZEROTTS_MAX_TEXT_CHARS:-2000}
      - ZEROTTS_OUTPUT_ROOT=${ZEROTTS_OUTPUT_ROOT:-/tmp/zerotts_service}
      - ZEROTTS_SHUTDOWN_TIMEOUT_MS=${ZEROTTS_SHUTDOWN_TIMEOUT_MS:-15000}
    volumes:
      - zerotts_models:/root/.cache
      - zerotts_out:/tmp/zerotts_service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5005/health',timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # NOTE: there is deliberately NO separate `worker` service. The API service
  # runs queue workers in-process (server.js, INSTANCE_MODE=single) — a second
  # container sharing the sql.js volume cannot take writer ownership, so it
  # would crash-loop. Scale workers by running more API containers only after
  # replacing sql.js with a real client/server database.

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  redis_data:
  storage_data:
  db_data:
  zerotts_models:
  zerotts_out:
