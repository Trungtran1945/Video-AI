services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=file:/app/data/data.db
      - DB_PATH=/app/data/data.db
      - INSTANCE_MODE=single
      - DB_MAX_PENDING_WRITES=${DB_MAX_PENDING_WRITES:-1000}
      - DB_SLOW_WRITE_MS=${DB_SLOW_WRITE_MS:-1000}
      - PROJECT_LEASE_SECONDS=${PROJECT_LEASE_SECONDS:-1800}
      - UPLOAD_SESSION_TTL_MINUTES=${UPLOAD_SESSION_TTL_MINUTES:-60}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-}
      - MASTER_KEY=${MASTER_KEY:-}
      - MAX_CONCURRENT_PROJECTS_PER_USER=${MAX_CONCURRENT_PROJECTS_PER_USER:-2}
      - PROJECT_RETENTION_DAYS=${PROJECT_RETENTION_DAYS:-30}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - NOTIFY_FROM_EMAIL=${NOTIFY_FROM_EMAIL:-noreply@asf.local}
      - QUOTA_WARNING_THRESHOLD=${QUOTA_WARNING_THRESHOLD:-0.8}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
    volumes:
      - storage_data:/app/storage
      - db_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NOTE: there is deliberately NO separate `worker` service. The API service
  # runs queue workers in-process (server.js, INSTANCE_MODE=single) — a second
  # container sharing the sql.js volume cannot take writer ownership, so it
  # would crash-loop. Scale workers by running more API containers only after
  # replacing sql.js with a real client/server database.

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  redis_data:
  storage_data:
  db_data:
